name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Check version consistency
        run: |
          set -e
          V=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          [ "$V" = "$(cat VERSION | tr -d '[:space:]')" ] || { echo "VERSION mismatch"; exit 1; }
          grep -q "## \[$V\]" CHANGELOG.md || { echo "CHANGELOG missing $V"; exit 1; }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: bodyscope3d-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: app/build/reports/tests }
