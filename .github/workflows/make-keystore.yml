name: Make signing keystore (run ONCE, manually)
on:
  workflow_dispatch:
    inputs:
      alias: { description: "Key alias", default: "bodyscope", required: true }
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore + secrets file
        run: |
          set -e
          SP=$(openssl rand -hex 16); KP=$SP
          echo "::add-mask::$SP"
          keytool -genkeypair -v -keystore release.keystore -storetype PKCS12 -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$SP" -keypass "$KP" \
            -dname "CN=BodyScope 3D, O=BodyScope3D, C=SA" > /dev/null
          {
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 release.keystore)"
            echo "ANDROID_KEYSTORE_PASSWORD=$SP"
            echo "ANDROID_KEY_ALIAS=${{ inputs.alias }}"
            echo "ANDROID_KEY_PASSWORD=$KP"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets-DELETE-AFTER-USE
          path: |
            secrets.txt
            release.keystore
          retention-days: 1
